name: Hive
on:
  push:
    branches:
      - antithesis
    paths:
      - 'src/**'
      - 'test/**'
      - '.github/workflows/*.yml'
      - 'pom.xml'
  pull_request:
    branches:
      - antithesis
    paths:
      - 'src/**'
      - 'test/**'
      - '.github/workflows/*.yml'
      - 'pom.xml'
jobs:
  hive:
    name: DBMS Tests (Hive)
    runs-on: ubuntu-latest
    services:
      metastore:
        image: apache/hive:4.0.1
        env:
          SERVICE_NAME: 'metastore'
        ports:
          - 9083:9083
        volumes:
          - warehouse:/opt/hive/data/warehouse
      hiveserver2:
        image: apache/hive:4.0.1
        env:
          SERVICE_NAME: 'hiveserver2'
        ports:
          - 10000:10000
          - 10002:10002
        volumes:
          - warehouse:/opt/hive/data/warehouse
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build SQLancer
        run: mvn -B package -DskipTests=true
      - name: Run Tests
        run: HIVE_AVAILABLE=true mvn -Djacoco.skip=true -Dtest=TestHiveTLP test
  spark:
    name: DBMS Tests (Spark)
    runs-on: ubuntu-latest
    services:
      spark:
        image: apache/spark:3.5.1
        ports:
          - 10000:10000
        command: >-
          /opt/spark/bin/spark-submit
          --class org.apache.spark.sql.hive.thriftserver.HiveThriftServer2
          --name "Thrift JDBC/ODBC Server"
          --master local[*]
          --driver-memory 4g
          --conf spark.hive.server2.thrift.port=10000
          --conf spark.sql.warehouse.dir=/tmp/spark-warehouse
          spark-internal
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build SQLancer
        run: mvn -B package -DskipTests=true
      - name: Run Tests
        run: SPARK_AVAILABLE=true mvn -Djacoco.skip=true -Dtest=TestSparkTLP test
